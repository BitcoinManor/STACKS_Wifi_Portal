
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StacksWorth WiFi Setup</title>
  <style>
    html, body {
  margin: 0;
  padding: 0;
  background-color: #000000;
  font-family: 'Segoe UI', sans-serif;
  color: white;
  width: 100%;
}

    body {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px 0;
    }

    .card {
      background-color: #000000;
      border-radius: 12px;
      padding: 30px 24px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      border: 4px solid;
      border-image: linear-gradient(135deg, #aaa, #eee) 1;
      box-shadow: 0 0 25px rgba(192,192,192, 0.4), 0 0 10px rgba(255,255,255,0.1);
    }

    .card:hover {
      box-shadow: 0 0 40px rgba(255,255,255, 0.6), 0 0 12px rgba(255,255,255,0.2);
      transition: box-shadow 0.3s ease;
    }

    .logo {
      border: 2px solid silver;
      background-color: #000000;
      color: silver;
      font-weight: bold;
      padding: 14px 0;
      border-radius: 6px;
      font-size: 2.8rem;
      letter-spacing: 4px;
      margin-bottom: 24px;
    }

    h2 {
      margin-bottom: 18px;
      font-size: 1.4rem;
    }

    .device-select {
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .device-select label {
      margin: 0 10px;
      cursor: pointer;
    }

    .form-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .form-group label {
      flex: 1;
      margin-right: 10px;
      text-align: left;
      text-transform: uppercase;
    }

    .form-group input,
    .form-group select {
      flex: 2;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid #777;
      background-color: #000000;
      color: white;
      font-size: 1rem;
    }

    .button {
      margin-top: 20px;
      width: 100%;
      background: linear-gradient(145deg, #999999, #cccccc);
      color: black;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .button:hover {
      background: linear-gradient(145deg, #cccccc, #eeeeee);
    }

    .button:active {
      background: linear-gradient(145deg, #fca420, #ff8800);
      color: white;
      transform: scale(0.98);
    }

    .version {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #777;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
    }

    .footer a {
      color: #fca420;
      text-decoration: none;
    }

    .popup {
      display: none;
      background-color: #111;
      color: #fca420;
      border: 1px solid #fca420;
      padding: 20px;
      border-radius: 10px;
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 0 10px #000;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .password-wrap { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      flex: 2;
    }
    
    .password-wrap input {
      flex: 1;
      margin: 0;
    }
    
    .pw-toggle {
      background: none;
      border: 1px solid #777;
      border-radius: 4px;
      padding: 6px 10px;
      color: #ccc;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
      min-width: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .pw-toggle:hover { 
      border-color: #aaa; 
      color: #eee; 
    }

    @media (max-width: 600px) {
  .form-group {
    flex-direction: column;
    align-items: stretch;
  }

  .form-group label {
    margin-bottom: 6px;
    margin-right: 0;
    text-align: left;
    font-size: 0.8rem;
    opacity: 0.85;
  }

  .password-wrap {
    width: 100%;
  }

  .logo {
    font-size: 2.2rem;
    padding: 12px 0;
  }

  .card {
    padding: 22px 16px;
  }

  .footer {
    margin-top: 16px;
  }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">STACKSWORTH</div>
    <h2>Wi-Fi Setup</h2>

    <div class="device-select">
      <label><input type="radio" name="device" value="Matrix" checked> Matrix</label>
      <label><input type="radio" name="device" value="Spark"> Spark</label>
    </div>

    <div class="form-group">
      <label for="ssid">SSID Wi-Fi</label>
      <input type="text" id="ssid" name="ssid" placeholder="Your Network">
    </div>

          <div class="form-group">
        <label for="password">Password:</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" maxlength="63" autocomplete="new-password">
          <button type="button" class="pw-toggle" id="pwToggle" onclick="togglePassword()" aria-label="Show/hide password">👁</button>
        </div>
      </div>

    <div class="form-group">
      <label for="city">City</label>
      <input type="text" id="city" name="city" placeholder="e.g. Calgary">
    </div>

    <div class="form-group">
      <label for="timezone">Time Zone</label>
      <select id="timezone" name="timezone">
        <option value="0">UTC (+0)</option>
        <option value="1">London (+0/+1)</option>
        <option value="2">Paris (+1/+2)</option>
        <option value="3">Helsinki (+2/+3)</option>
        <option value="4">Moscow (+3)</option>
        <option value="5">Tokyo (+9)</option>
        <option value="6">Sydney (+10/+11)</option>
        <option value="7">Auckland (+12/+13)</option>
        <option value="8">Hawaii (-10)</option>
        <option value="9">Alaska (-9/-8)</option>
        <option value="10">Pacific (-8/-7)</option>
        <option value="11" selected>Mountain (-7/-6)</option>
        <option value="12">Central (-6/-5)</option>
        <option value="13">Eastern (-5/-4)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="currency">Currency</label>
      <select id="currency" name="currency">
        <option value="USD" selected>US Dollar ($)</option>
        <option value="CAD">Canadian Dollar (C$)</option>
        <option value="EUR">Euro (€)</option>
        <option value="GBP">British Pound (£)</option>
        <option value="JPY">Japanese Yen (¥)</option>
        <option value="AUD">Australian Dollar (A$)</option>
        <option value="CHF">Swiss Franc (CHF)</option>
        <option value="CNY">Chinese Yuan (¥)</option>
        <option value="SEK">Swedish Krona (kr)</option>
        <option value="NOK">Norwegian Krone (kr)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="theme">Display Theme</label>
      <select id="theme" name="theme">
        <option value="scroll" selected>Dynamic Scroll</option>
        <option value="fade">Smooth Fade</option>
      </select>
    </div>

    <button class="button" onclick="saveAndReboot()">SAVE AND REBOOT</button>
    <div class="version">v0.1.0 – 2025</div>
  </div>
  
  <div class="footer">
    STACKSWORTH • <a href="https://stacksworth.com" target="_blank">stacksworth.com</a>
  </div>	
  <div class="footer">
    Built by <strong>Bitcoin Manor</strong> • <a href="https://bitcoinmanor.com" target="_blank">bitcoinmanor.com</a>
  </div>

  <div id="popup" class="popup">
    <div style="text-align: right;">
      <button onclick="hidePopup()" style="background:none; border:none; color:#fca420; font-size:1.2rem; cursor:pointer;">❌</button>
    </div>
    <p>✅ Settings saved. Rebooting now...</p>
    <p>If your browser shows an error, you can ignore and close it.</p>
    <p>You can now close this WiFi Setup screen.</p>

  </div>


  <script>
  function saveAndReboot() {
    const form = new FormData();
    form.append("ssid", document.getElementById("ssid").value);
    form.append("password", document.getElementById("password").value);
    form.append("city", document.getElementById("city").value);
    form.append("timezone", document.getElementById("timezone").value);
    form.append("currency", document.getElementById("currency").value);
    form.append("theme", document.getElementById("theme").value);
    form.append("device", document.querySelector('input[name="device"]:checked').value);

    fetch("/save", {
      method: "POST",
      body: form
    })
    .then(response => {
      if (response.ok) {
        showPopup();
        setTimeout(() => {
          window.location.href = "/reboot";
        }, 3000);
      } else {
        console.warn("⚠️ Save returned non-OK response. Assuming reboot may have triggered.");
        showPopup(); // Show popup anyway to avoid confusion
      }
    })
    .catch(error => {
      console.warn("⚠️ Connection dropped — likely rebooting. Showing popup anyway.");
      console.error("Error:", error);
      showPopup();
    });
  }

    function showPopup() {
    const popup = document.getElementById("popup");
    popup.style.display = "block";
    setTimeout(() => { popup.style.opacity = "1"; }, 10);
  }


    function hidePopup() {
    const popup = document.getElementById("popup");
    popup.style.opacity = "0";
    setTimeout(() => { popup.style.display = "none"; }, 500);
  }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleButton = document.getElementById('pwToggle');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleButton.innerHTML = '🙈';
        toggleButton.setAttribute('aria-label', 'Hide password');
      } else {
        passwordInput.type = 'password';
        toggleButton.innerHTML = '👁';
        toggleButton.setAttribute('aria-label', 'Show password');
      }
    }


</script>


</body>
</html>
